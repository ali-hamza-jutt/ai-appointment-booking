name: Agent evals

# Live evals call Mistral, so they run nightly and when the prompt changes
# rather than on every pull request. Recorded evals run with the normal tests.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - server/src/integrations/ai/**
      - server/evals/**

jobs:
  live-evals:
    name: Live agent evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bookwise
          POSTGRES_PASSWORD: bookwise
          POSTGRES_DB: bookwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://bookwise:bookwise@localhost:5432/bookwise_test?schema=public
      TEST_DATABASE_URL: postgresql://bookwise:bookwise@localhost:5432/bookwise_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-secret-that-is-longer-than-32-characters
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Skip without a Mistral key
        if: env.MISTRAL_API_KEY == ''
        working-directory: .
        run: echo "::notice::MISTRAL_API_KEY is not set; live agent evals were skipped."
      - uses: actions/checkout@v4
        if: env.MISTRAL_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.MISTRAL_API_KEY != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: env.MISTRAL_API_KEY != ''
        run: npm ci
      - if: env.MISTRAL_API_KEY != ''
        run: npm run eval:live
      - uses: actions/upload-artifact@v4
        if: always() && env.MISTRAL_API_KEY != ''
        with:
          name: agent-eval-results
          path: server/evals/results/
